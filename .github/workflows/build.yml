name: Build and verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target
          key: performance
      - name: Test regression detection
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Compare performance with the pinned reference
        run: python3 scripts/benchmark.py
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-results
          path: test-results/performance/
          if-no-files-found: warn

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf squashfs-tools webkit2gtk-driver xvfb dbus-x11 python3-gi gir1.2-gtk-3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}
      - run: yarn install --immutable
      - run: yarn check && yarn lint
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build desktop packages
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          args: --target ${{ matrix.target }} -- --locked
      - name: Test Rust code
        run: yarn test
      - name: Lint Rust code
        if: runner.os == 'Linux'
        run: cargo clippy --release --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Fix Linux AppImage and test the packaged application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          bash scripts/fix-appimage.sh "${appimage[0]}"
          dbus-run-session -- xvfb-run -a python3 tests/smoke-linux.py "${appimage[0]}"
      - name: Archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          tar -czf "Graph.Prime_${{ matrix.target }}.app.tar.gz" "Graph Prime.app"
      - name: Upload verified packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
      - name: Upload Linux test evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-smoke-results
          path: test-results/
