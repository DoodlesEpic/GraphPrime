name: Build and verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf squashfs-tools webkit2gtk-driver xvfb dbus-x11 python3-gi gir1.2-gtk-3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}
      - run: yarn install --immutable
      - run: yarn check && yarn lint && yarn build && yarn test
      - name: Build desktop packages
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }} -- --locked
      - name: Fix Linux AppImage and test the packaged application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          bash scripts/fix-appimage.sh "${appimage[0]}"
          dbus-run-session -- xvfb-run -a python3 tests/smoke-linux.py "${appimage[0]}"
      - name: Archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          tar -czf "Graph.Prime_${{ matrix.target }}.app.tar.gz" "Graph Prime.app"
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
      - name: Upload Linux test evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-results
          path: test-results/
