name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          test -s "docs/releases/$RELEASE_TAG.md"
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: packages
      - name: Prepare release assets
        run: |
          mkdir release-assets
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            destination="release-assets/${name// /.}"
            if test -e "$destination"; then
              echo "Duplicate release asset: $destination" >&2
              exit 1
            fi
            cp "$file" "$destination"
          done < <(find packages -type f -print0)
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Upload complete release as a draft for final verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
