[package]
name = "app"
version = "2.1.0"
description = "Cross-platform prime number calculator developed on Tauri and Svelte with beautiful frappe graphs and excellent performance"
authors = ["Doodles"]
license = "GPL-3.0-only"
keywords = ["svelte", "prime", "sveltejs", "tauri", "taurijs"]
repository = "https://github.com/DoodlesEpic/GraphPrime"
default-run = "app"
edition = "2024"
rust-version = "1.98.1"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
tauri = "~2.11.5"
slow_primes = "0.1.14"
tauri-plugin-clipboard-manager = "=2.3.3"

[dev-dependencies]
serde_json = "1.0"

[features]
# Tauri uses its asset protocol for production builds and a dev server locally.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
